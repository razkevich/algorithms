plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building a CLI application.
    id 'application'
}

// Interview-prep scratch solutions live under `prep/` with packages like
// `prep.concurrency`. Expose them to Gradle (and via it, IntelliJ) as a
// dedicated source set rooted at the repo root, filtered to prep/**. Keeps
// them out of `main` so the app build is unaffected.
sourceSets {
    prep {
        java {
            srcDirs = ['.']
            include 'prep/**'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation 'com.google.guava:guava:28.2-jre'
    implementation 'org.apache.commons:commons-collections4:4.0'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.12'
}

application {
    // Define the main class for the application.
    mainClass = 'interviewcamp.App'
}
